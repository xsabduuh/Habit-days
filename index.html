<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="يومياتي المتطورة">
  <meta name="theme-color" content="#1e293b" id="theme-color-meta">
  <title>يومياتي المتطورة | تتبع العادات الذكي</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #f1f5f9;
      --card: rgba(255,255,255,0.96);
      --text: #0f172a;
      --text-muted: #475569;
      --border: #e2e8f0;
      --accent: #10b981;
      --accent-dark: #059669;
      --danger: #ef4444;
      --shadow: 0 8px 20px rgba(0,0,0,0.05);
      --transition: all 0.2s ease;
    }

    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    body {
      font-family: system-ui, 'Segoe UI', 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1rem 1rem 2rem;
      max-width: 700px;
      margin: 0 auto;
      min-height: 100vh;
      transition: var(--transition);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(2px);
      border-radius: 32px;
      padding: 1.25rem 1rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: var(--transition);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #3b82f6);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .dark-mode-toggle {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 8px 16px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text);
    }

    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.05);
      border-radius: 60px;
      padding: 0.4rem 0.5rem;
      margin-bottom: 0.5rem;
    }
    .date-nav-btn {
      background: var(--card);
      border: 1px solid var(--border);
      width: 40px;
      height: 40px;
      border-radius: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text);
      transition: var(--transition);
    }
    .date-nav-btn:active { transform: scale(0.94); }
    .current-date {
      font-weight: 700;
      background: var(--card);
      padding: 0.3rem 1rem;
      border-radius: 40px;
      color: var(--text);
    }
    .today-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.3rem 0.9rem;
      border-radius: 40px;
      cursor: pointer;
    }

    .habits-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-top: 0.5rem;
    }
    .habit-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      padding: 0.9rem 1rem;
      border-radius: 24px;
      border: 1px solid var(--border);
    }
    .habit-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    .habit-emoji {
      font-size: 1.7rem;
    }
    .habit-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }
    .habit-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .habit-check {
      width: 36px;
      height: 36px;
      border-radius: 36px;
      background: var(--card);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.2rem;
      transition: all 0.15s;
    }
    .habit-check.completed {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      box-shadow: 0 2px 8px rgba(16,185,129,0.4);
    }
    .delete-habit {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--danger);
      opacity: 0.6;
      padding: 5px;
    }
    .delete-habit:hover { opacity: 1; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-block {
      background: var(--bg);
      border-radius: 24px;
      padding: 12px;
      text-align: center;
    }
    .stat-number {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
    }

    .heatmap {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin: 15px 0;
    }
    .heatmap-day {
      aspect-ratio: 1;
      background: var(--bg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: bold;
      color: var(--text-muted);
      border: 1px solid var(--border);
      transition: 0.1s;
    }
    .heatmap-day.completed {
      background: var(--accent);
      color: white;
    }

    .chart-container {
      margin: 20px 0;
      height: 150px;
    }

    .add-habit {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .add-habit input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 60px;
      padding: 8px 16px;
      color: var(--text);
    }
    .add-habit button {
      background: var(--accent);
      border: none;
      border-radius: 60px;
      padding: 8px 20px;
      color: white;
      cursor: pointer;
    }

    .export-import {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 12px;
    }
    .small-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 6px 12px;
      font-size: 0.7rem;
      cursor: pointer;
      color: var(--text);
    }

    footer {
      font-size: 0.65rem;
      text-align: center;
      color: var(--text-muted);
    }
    button { cursor: pointer; }
    @media (max-width: 500px) {
      .stat-number { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="card">
    <div class="header">
      <h1>📆 يومياتي المتطورة</h1>
      <button class="dark-mode-toggle" id="darkModeToggle">🌙 ليلي</button>
    </div>
    <p style="font-size:0.75rem; margin-top:4px;">تتبع عاداتك + تحليلات ذكية + تقويم حراري</p>
  </div>

  <div class="card" style="padding:0.8rem 1rem;">
    <div class="date-bar">
      <button class="date-nav-btn" id="prevDayBtn">←</button>
      <span class="current-date" id="currentDateLabel">--</span>
      <button class="date-nav-btn" id="nextDayBtn">→</button>
      <button class="today-btn" id="todayBtn">اليوم</button>
    </div>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items:center;">
      <span>✅ مهام اليوم</span>
      <span id="completionBadge" style="background:var(--bg); padding:2px 12px; border-radius:40px;">0%</span>
    </div>
    <div id="habitsContainer" class="habits-list"></div>
    <div class="add-habit">
      <input type="text" id="newHabitName" placeholder="عادة جديدة... (مثل: قراءة)">
      <input type="text" id="newHabitEmoji" placeholder="رمز" maxlength="2" style="width:60px;">
      <button id="addHabitBtn">➕ أضف</button>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:800; margin-bottom:12px;">📊 إحصائيات ذكية</div>
    <div class="stats-grid">
      <div class="stat-block"><div class="stat-number" id="todayCompleteCount">0</div><div>اليوم</div></div>
      <div class="stat-block"><div class="stat-number" id="streakDays">0</div><div>🔥 أيام متتالية كاملة</div></div>
      <div class="stat-block"><div class="stat-number" id="totalPerfectDays">0</div><div>🏆 أيام مثالية</div></div>
      <div class="stat-block"><div class="stat-number" id="totalHabitsDone">0</div><div>📌 إنجازات كلية</div></div>
    </div>

    <div style="margin: 15px 0;">
      <div style="font-weight:600; margin-bottom:8px;">📅 تقويم الأداء (آخر 30 يوم)</div>
      <div id="heatmapContainer" class="heatmap"></div>
    </div>

    <div style="margin: 15px 0;">
      <div style="font-weight:600; margin-bottom:8px;">📈 الإنجازات الأسبوعية</div>
      <canvas id="weeklyChart" width="400" height="150" style="width:100%; height:150px; background:var(--bg); border-radius:16px;"></canvas>
    </div>

    <div class="export-import">
      <button id="exportDataBtn" class="small-btn">📤 تصدير البيانات</button>
      <button id="importDataBtn" class="small-btn">📥 استيراد</button>
      <button id="resetAllDataBtn" class="small-btn" style="color:var(--danger);">🗑️ إعادة ضبط</button>
    </div>
  </div>
  <footer>✨ إضغط مطولاً على العادة لحذفها | اهتزاز عند الإنجاز</footer>
</div>

<script>
  // -------------------- الإعدادات الأساسية --------------------
  let HABITS = []; // سيتم تحميلها من localStorage أو البدء بالعادات الافتراضية
  let appData = { habitsHistory: {} }; // { "2025-03-27": { habitId: true/false, ... } }
  let currentDate = new Date().toISOString().slice(0,10);
  
  const STORAGE_KEY = "advanced_habits_v2";

  // تهيئة العادات الافتراضية
  function initDefaultHabits() {
    return [
      { id: "no_bad", name: "🚫 لا عادة سيئة", emoji: "🚫" },
      { id: "pray", name: "🕌 صليت", emoji: "🕌" },
      { id: "wash_face", name: "💧 غسلت وجهي", emoji: "💧" },
      { id: "productive", name: "🌟 عملت شيئاً مفيداً", emoji: "🌟" }
    ];
  }

  // تحميل البيانات
  function loadData() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      try {
        const parsed = JSON.parse(stored);
        HABITS = parsed.habits || initDefaultHabits();
        appData.habitsHistory = parsed.history || {};
      } catch(e) { console.warn(e); }
    } else {
      HABITS = initDefaultHabits();
      appData.habitsHistory = {};
    }
    // التأكد من أن كل يوم له سجل لجميع العادات
    for (let date in appData.habitsHistory) {
      const day = appData.habitsHistory[date];
      HABITS.forEach(h => { if (day[h.id] === undefined) day[h.id] = false; });
    }
    saveData();
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      habits: HABITS,
      history: appData.habitsHistory
    }));
  }

  // الحصول على حالة اليوم
  function getDayStatus(date) {
    if (!appData.habitsHistory[date]) {
      const empty = {};
      HABITS.forEach(h => { empty[h.id] = false; });
      appData.habitsHistory[date] = empty;
    }
    return appData.habitsHistory[date];
  }

  function setHabitStatus(date, habitId, completed) {
    const day = getDayStatus(date);
    day[habitId] = completed;
    saveData();
    if (date === currentDate) {
      renderHabits();
      updateStatsAndVisuals();
    } else {
      updateStatsAndVisuals();
    }
    // اهتزاز خفيف
    if (navigator.vibrate) navigator.vibrate(50);
  }

  // إضافة عادة جديدة
  function addHabit(name, emoji) {
    if (!name.trim()) return;
    const id = "habit_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6);
    HABITS.push({ id, name: name.trim(), emoji: emoji || "⭐" });
    // إضافة العادة لجميع الأيام الموجودة (لضمان التوافق)
    for (let date in appData.habitsHistory) {
      if (appData.habitsHistory[date][id] === undefined) appData.habitsHistory[date][id] = false;
    }
    saveData();
    renderHabits();
    updateStatsAndVisuals();
  }

  function deleteHabit(habitId) {
    if (confirm("هل تريد حذف هذه العادة؟ سيتم فقدان بياناتها السابقة.")) {
      HABITS = HABITS.filter(h => h.id !== habitId);
      // حذف المفاتيح من كل يوم
      for (let date in appData.habitsHistory) {
        delete appData.habitsHistory[date][habitId];
      }
      saveData();
      renderHabits();
      updateStatsAndVisuals();
    }
  }

  // عرض قائمة العادات
  function renderHabits() {
    const container = document.getElementById("habitsContainer");
    const dayData = getDayStatus(currentDate);
    container.innerHTML = "";
    HABITS.forEach(habit => {
      const completed = dayData[habit.id] === true;
      const div = document.createElement("div");
      div.className = "habit-item";
      div.innerHTML = `
        <div class="habit-info">
          <div class="habit-emoji">${habit.emoji}</div>
          <div class="habit-name">${habit.name}</div>
        </div>
        <div class="habit-actions">
          <div class="habit-check ${completed ? 'completed' : ''}" data-id="${habit.id}">${completed ? '✓' : '○'}</div>
          <button class="delete-habit" data-id="${habit.id}" title="حذف">🗑️</button>
        </div>
      `;
      const checkBtn = div.querySelector(".habit-check");
      checkBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const newStatus = !completed;
        setHabitStatus(currentDate, habit.id, newStatus);
      });
      const delBtn = div.querySelector(".delete-habit");
      delBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        deleteHabit(habit.id);
      });
      container.appendChild(div);
    });
  }

  // إحصائيات متقدمة
  function getHabitStats() {
    let stats = {};
    HABITS.forEach(h => { stats[h.id] = { total:0, currentStreak:0, bestStreak:0 }; });
    const sortedDates = Object.keys(appData.habitsHistory).sort();
    for (let h of HABITS) {
      let total = 0, curStreak = 0, best = 0;
      for (let date of sortedDates) {
        if (appData.habitsHistory[date][h.id]) {
          total++;
          curStreak++;
          if (curStreak > best) best = curStreak;
        } else {
          curStreak = 0;
        }
      }
      // current streak من اليوم للخلف
      let today = new Date();
      let streak = 0;
      for (let i = 0; i < 365; i++) {
        let d = new Date(today);
        d.setDate(today.getDate() - i);
        let dateStr = d.toISOString().slice(0,10);
        if (appData.habitsHistory[dateStr] && appData.habitsHistory[dateStr][h.id]) streak++;
        else break;
      }
      stats[h.id] = { total, currentStreak: streak, bestStreak: best };
    }
    return stats;
  }

  function getPerfectStreak() {
    let streak = 0;
    let today = new Date();
    for (let i = 0; i < 1000; i++) {
      let d = new Date(today);
      d.setDate(today.getDate() - i);
      let dateStr = d.toISOString().slice(0,10);
      const day = appData.habitsHistory[dateStr];
      if (!day) break;
      let allTrue = HABITS.every(h => day[h.id] === true);
      if (allTrue) streak++;
      else break;
    }
    return streak;
  }

  function getPerfectDaysCount() {
    let count = 0;
    for (let date in appData.habitsHistory) {
      const day = appData.habitsHistory[date];
      if (HABITS.every(h => day[h.id] === true)) count++;
    }
    return count;
  }

  function getTotalCompletions() {
    let total = 0;
    for (let date in appData.habitsHistory) {
      const day = appData.habitsHistory[date];
      total += HABITS.filter(h => day[h.id] === true).length;
    }
    return total;
  }

  function getTodayCompletion() {
    const day = getDayStatus(currentDate);
    const completed = HABITS.filter(h => day[h.id] === true).length;
    const percent = Math.round((completed / HABITS.length) * 100);
    return { completed, total: HABITS.length, percent };
  }

  // رسم بياني أسبوعي
  function renderWeeklyChart() {
    const canvas = document.getElementById("weeklyChart");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const width = canvas.clientWidth;
    const height = 150;
    canvas.width = width;
    canvas.height = height;
    ctx.clearRect(0, 0, width, height);
    const today = new Date();
    const days = [];
    for (let i = 6; i >= 0; i--) {
      let d = new Date(today);
      d.setDate(today.getDate() - i);
      days.push(d.toISOString().slice(0,10));
    }
    const values = days.map(date => {
      const day = appData.habitsHistory[date];
      if (!day) return 0;
      return HABITS.filter(h => day[h.id] === true).length;
    });
    const maxVal = HABITS.length;
    const barWidth = (width / 7) * 0.7;
    const startX = (width / 7) * 0.15;
    ctx.fillStyle = "#10b981";
    values.forEach((val, i) => {
      const barHeight = (val / maxVal) * (height - 30);
      const x = startX + i * (width / 7);
      const y = height - barHeight - 10;
      ctx.fillRect(x, y, barWidth, barHeight);
      ctx.fillStyle = "var(--text-muted)";
      ctx.font = "10px system-ui";
      ctx.fillText(val, x+2, y-2);
      ctx.fillStyle = "#10b981";
    });
  }

  // تقويم حراري
  function renderHeatmap() {
    const container = document.getElementById("heatmapContainer");
    if (!container) return;
    container.innerHTML = "";
    const today = new Date();
    for (let i = 29; i >= 0; i--) {
      let d = new Date(today);
      d.setDate(today.getDate() - i);
      const dateStr = d.toISOString().slice(0,10);
      const dayData = appData.habitsHistory[dateStr];
      let completedPercent = 0;
      if (dayData) {
        const done = HABITS.filter(h => dayData[h.id] === true).length;
        completedPercent = (done / HABITS.length) * 100;
      }
      const div = document.createElement("div");
      div.className = "heatmap-day";
      if (completedPercent === 100) div.classList.add("completed");
      div.textContent = d.getDate();
      div.title = `${dateStr}: ${Math.round(completedPercent)}%`;
      container.appendChild(div);
    }
  }

  function updateStatsAndVisuals() {
    const { completed, total, percent } = getTodayCompletion();
    document.getElementById("todayCompleteCount").innerText = `${completed}/${total}`;
    document.getElementById("completionBadge").innerText = `${percent}%`;
    document.getElementById("streakDays").innerText = getPerfectStreak();
    document.getElementById("totalPerfectDays").innerText = getPerfectDaysCount();
    document.getElementById("totalHabitsDone").innerText = getTotalCompletions();
    renderWeeklyChart();
    renderHeatmap();
  }

  function updateDateDisplay() {
    const dateObj = new Date(currentDate + "T12:00:00");
    const formatted = dateObj.toLocaleDateString('ar-EG', { year:'numeric', month:'long', day:'numeric' });
    document.getElementById("currentDateLabel").innerText = formatted;
    renderHabits();
    updateStatsAndVisuals();
  }

  function goPrevDay() {
    let d = new Date(currentDate + "T12:00:00");
    d.setDate(d.getDate() - 1);
    currentDate = d.toISOString().slice(0,10);
    updateDateDisplay();
  }
  function goNextDay() {
    let d = new Date(currentDate + "T12:00:00");
    d.setDate(d.getDate() + 1);
    currentDate = d.toISOString().slice(0,10);
    updateDateDisplay();
  }
  function goToday() {
    currentDate = new Date().toISOString().slice(0,10);
    updateDateDisplay();
  }

  // تصدير
  function exportData() {
    const data = { habits: HABITS, history: appData.habitsHistory };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `habits_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (parsed.habits && parsed.history) {
          HABITS = parsed.habits;
          appData.habitsHistory = parsed.history;
          saveData();
          updateDateDisplay();
          alert("تم الاستيراد بنجاح!");
        } else throw new Error();
      } catch(err) {
        alert("ملف غير صالح");
      }
    };
    reader.readAsText(file);
  }

  function resetAll() {
    if (confirm("سيتم حذف كل العادات والبيانات. متأكد؟")) {
      HABITS = initDefaultHabits();
      appData.habitsHistory = {};
      saveData();
      updateDateDisplay();
    }
  }

  // Dark mode
  function initDarkMode() {
    const dark = localStorage.getItem("darkMode") === "true";
    if (dark) document.body.classList.add("dark");
    document.getElementById("darkModeToggle").addEventListener("click", () => {
      document.body.classList.toggle("dark");
      localStorage.setItem("darkMode", document.body.classList.contains("dark"));
    });
  }

  // أحداث
  document.addEventListener("DOMContentLoaded", () => {
    loadData();
    initDarkMode();
    document.getElementById("prevDayBtn").addEventListener("click", goPrevDay);
    document.getElementById("nextDayBtn").addEventListener("click", goNextDay);
    document.getElementById("todayBtn").addEventListener("click", goToday);
    document.getElementById("addHabitBtn").addEventListener("click", () => {
      const name = document.getElementById("newHabitName").value;
      const emoji = document.getElementById("newHabitEmoji").value || "📌";
      if (name.trim()) addHabit(name, emoji);
      document.getElementById("newHabitName").value = "";
      document.getElementById("newHabitEmoji").value = "";
    });
    document.getElementById("exportDataBtn").addEventListener("click", exportData);
    document.getElementById("resetAllDataBtn").addEventListener("click", resetAll);
    const importInput = document.createElement("input");
    importInput.type = "file";
    importInput.accept = "application/json";
    document.getElementById("importDataBtn").addEventListener("click", () => {
      importInput.click();
    });
    importInput.addEventListener("change", (e) => {
      if (e.target.files.length) importData(e.target.files[0]);
    });
    updateDateDisplay();
  });
</script>
</body>
</html>
