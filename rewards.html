<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>متجر المكافآت | يومياتي</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      font-family: system-ui, 'Segoe UI', 'Tajawal', sans-serif;
      background: radial-gradient(circle at 20% 30%, #0b1120, #030617);
      min-height: 100vh;
      padding: 1rem;
      color: #f1f5f9;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
    }
    .card {
      background: rgba(12, 18, 34, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 1rem;
    }
    .points {
      background: linear-gradient(135deg, #facc15, #f97316);
      color: #0f172a;
      padding: 6px 16px;
      border-radius: 40px;
      font-weight: bold;
    }
    .scene {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 28px;
      min-height: 200px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      margin-bottom: 20px;
      position: relative;
    }
    .item {
      background: rgba(56, 189, 248, 0.2);
      border-radius: 20px;
      padding: 8px;
      width: 80px;
      text-align: center;
      font-size: 2rem;
      transition: transform 0.2s;
    }
    .item svg {
      width: 48px;
      height: 48px;
    }
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }
    .shop-item {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #38bdf8;
      border-radius: 24px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .shop-item:hover { transform: translateY(-4px); background: rgba(56, 189, 248, 0.2); }
    .shop-item.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .price {
      background: #facc15;
      color: #0f172a;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      display: inline-block;
      margin-top: 6px;
    }
    button {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border: none;
      border-radius: 40px;
      padding: 8px 16px;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    .back-link {
      display: inline-block;
      margin-top: 10px;
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="header">
      <h2>🎁 متجر المكافآت</h2>
      <div class="points" id="pointsDisplay">0 نقطة</div>
    </div>
    <p>استخدم نقاطك لشراء عناصر تبني حديقتك الداخلية. الهدف: اجمع 365 يوماً بدون عادة سيئة!</p>
  </div>

  <div class="card">
    <h3>🌱 حديقة الإنجازات</h3>
    <div id="sceneContainer" class="scene">
      <!-- سيتم عرض العناصر المشتراة هنا -->
    </div>
  </div>

  <div class="card">
    <h3>🛒 المتجر</h3>
    <div id="shopContainer" class="shop-grid"></div>
  </div>

  <div>
    <a href="index.html" class="back-link">← العودة إلى التطبيق الرئيسي</a>
  </div>
</div>

<script>
  // قائمة العناصر المتاحة للشراء
  const ITEMS = [
    { id: "tree", name: "شجرة", emoji: "🌳", cost: 50, svg: `<svg viewBox="0 0 24 24" fill="#38bdf8" width="40" height="40"><path d="M12 2L2 8l10 6 10-6-10-6zM2 17l10 6 10-6M2 12l10 6 10-6"/></svg>` },
    { id: "flower", name: "زهرة", emoji: "🌸", cost: 30, svg: `<svg viewBox="0 0 24 24" fill="#facc15" width="40" height="40"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M22 12h-4M12 22v-4M2 12h4M19 5l-3 3M5 5l3 3M5 19l3-3M19 19l-3-3"/></svg>` },
    { id: "sun", name: "شمس", emoji: "☀️", cost: 80, svg: `<svg viewBox="0 0 24 24" fill="#facc15" width="40" height="40"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M17.7 6.3l2.1-2.1M4.2 19.8l2.1-2.1"/></svg>` },
    { id: "cloud", name: "غيمة", emoji: "☁️", cost: 40, svg: `<svg viewBox="0 0 24 24" fill="#cbd5e1" width="40" height="40"><path d="M6 14c-2.2 0-4-1.8-4-4 0-2 1.5-3.6 3.5-3.9C6.2 4.3 8 3 10 3c3 0 5 2 5 5 0 1.5-.7 2.8-1.8 3.7C13.9 13.2 15 14.5 15 16c0 2.2-1.8 4-4 4H6c-2.2 0-4-1.8-4-4 0-1.8 1.2-3.3 2.8-3.8"/></svg>` },
    { id: "star", name: "نجمة", emoji: "⭐", cost: 100, svg: `<svg viewBox="0 0 24 24" fill="#facc15" width="40" height="40"><polygon points="12 2 15 8.5 22 9.5 17 14.5 18.5 21.5 12 17.5 5.5 21.5 7 14.5 2 9.5 9 8.5 12 2"/></svg>` }
  ];

  const STORAGE_KEY = "advanced_habits_v7";

  let userPoints = 0;
  let purchasedItems = [];

  function loadData() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      try {
        const parsed = JSON.parse(stored);
        // حساب النقاط من العادات
        let habits = parsed.habits || [];
        let history = parsed.history || {};
        let totalPoints = 0;
        for (let date in history) {
          const day = history[date];
          habits.forEach(habit => {
            if (day[habit.id]) totalPoints += (habit.points || 5);
          });
        }
        userPoints = totalPoints;
        purchasedItems = parsed.purchasedItems || [];
      } catch(e) { console.warn(e); }
    }
    document.getElementById("pointsDisplay").innerText = `${userPoints} نقطة`;
  }

  function savePurchased() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      const parsed = JSON.parse(stored);
      parsed.purchasedItems = purchasedItems;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
    } else {
      // إنشاء هيكل جديد
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ habits: [], history: {}, purchasedItems: purchasedItems }));
    }
    // تحديث النقاط المعروضة بعد الشراء
    loadData();
  }

  function renderScene() {
    const container = document.getElementById("sceneContainer");
    container.innerHTML = "";
    if (purchasedItems.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:#94a3b8;">✨ اشترِ عناصر لبناء حديقتك ✨</div>';
      return;
    }
    purchasedItems.forEach(itemId => {
      const item = ITEMS.find(i => i.id === itemId);
      if (item) {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = item.svg;
        div.title = item.name;
        container.appendChild(div);
      }
    });
  }

  function renderShop() {
    const container = document.getElementById("shopContainer");
    container.innerHTML = "";
    ITEMS.forEach(item => {
      const alreadyOwned = purchasedItems.includes(item.id);
      const canAfford = userPoints >= item.cost;
      const div = document.createElement("div");
      div.className = `shop-item ${(!canAfford || alreadyOwned) ? 'disabled' : ''}`;
      div.innerHTML = `
        <div style="font-size:2rem;">${item.emoji}</div>
        <div><strong>${item.name}</strong></div>
        <div class="price">${item.cost} نقطة</div>
        ${alreadyOwned ? '<div style="color:#10b981;">✓ مملوك</div>' : ''}
      `;
      if (!alreadyOwned && canAfford) {
        div.addEventListener("click", () => {
          if (confirm(`شراء ${item.name} مقابل ${item.cost} نقطة؟`)) {
            purchasedItems.push(item.id);
            userPoints -= item.cost;
            savePurchased();
            renderScene();
            renderShop();
            document.getElementById("pointsDisplay").innerText = `${userPoints} نقطة`;
          }
        });
      }
      container.appendChild(div);
    });
  }

  loadData();
  renderScene();
  renderShop();
</script>
</body>
</html>
