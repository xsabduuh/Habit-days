<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0f1a">
  <title>مدينة الإرادة | SimCity متقدم لمحاربة العادة</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', 'Tajawal', system-ui, sans-serif;
      background: radial-gradient(circle at 20% 30%, #0a0f1a, #020617);
      color: #e2e8f0;
      padding: 1rem;
      position: relative;
      min-height: 100vh;
      transition: background 0.5s;
    }

    .fog-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0,0,0,0) 30%, rgba(0,0,0,0.7) 90%);
      pointer-events: none;
      z-index: 100;
      transition: opacity 0.5s ease;
      backdrop-filter: blur(4px);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .card {
      background: rgba(15, 25, 45, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #38bdf8, #a78bfa);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .city-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      background: rgba(0,0,0,0.3);
      border-radius: 1.5rem;
      padding: 1rem;
    }
    .city-tile {
      aspect-ratio: 1;
      background: rgba(0,0,0,0.5);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      transition: 0.2s;
      border: 1px solid #334155;
      cursor: pointer;
      position: relative;
    }
    .city-tile:hover {
      transform: scale(1.05);
      background: #1e293b;
      border-color: #38bdf8;
    }
    .building-tooltip {
      position: absolute;
      bottom: 100%;
      background: #0f172a;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 12px;
      white-space: nowrap;
      display: none;
    }
    .city-tile:hover .building-tooltip {
      display: block;
    }

    .stats-dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px,1fr));
      gap: 12px;
      margin: 1rem 0;
    }
    .stat-card {
      background: rgba(0,0,0,0.4);
      border-radius: 1.5rem;
      padding: 0.8rem;
      text-align: center;
    }
    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
      background: linear-gradient(135deg, #facc15, #f97316);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      direction: ltr;
    }

    .shop-section {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px,1fr));
      gap: 12px;
      margin-top: 1rem;
    }
    .shop-item {
      background: rgba(0,0,0,0.5);
      border: 1px solid #38bdf8;
      border-radius: 1.2rem;
      padding: 0.8rem;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .shop-item:hover {
      transform: translateY(-4px);
      background: rgba(56,189,248,0.2);
    }
    .shop-price {
      background: #facc15;
      color: #0f172a;
      display: inline-block;
      padding: 2px 10px;
      border-radius: 2rem;
      font-size: 0.7rem;
      font-weight: bold;
      margin-top: 6px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7,1fr);
      gap: 6px;
      margin-top: 0.5rem;
    }
    .cal-day {
      background: #1e293b;
      border-radius: 0.5rem;
      text-align: center;
      padding: 6px;
      font-size: 0.7rem;
      border: 1px solid #334155;
    }
    .cal-day.success { background: #10b981; color: white; }
    .cal-day.fail { background: #ef4444; color: white; }
    .cal-day.missed { background: #475569; color: #cbd5e1; }

    .achievements-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 0.5rem;
    }
    .achievement-badge {
      background: linear-gradient(135deg, #f97316, #facc15);
      color: #0f172a;
      border-radius: 2rem;
      padding: 4px 12px;
      font-size: 0.7rem;
      font-weight: bold;
    }
    .locked {
      background: #334155;
      color: #94a3b8;
    }

    .btn {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border: none;
      border-radius: 2rem;
      padding: 10px 20px;
      font-weight: bold;
      color: #0f172a;
      cursor: pointer;
      margin: 0 5px;
      transition: 0.2s;
    }
    .btn-danger {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: white;
    }
    .btn-warning {
      background: linear-gradient(135deg, #facc15, #f97316);
      color: #0f172a;
    }
    .flex-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .city-level-badge {
      background: #0f172a;
      border-radius: 2rem;
      padding: 6px 16px;
      display: inline-block;
      margin-bottom: 12px;
      font-weight: bold;
    }

    body.city-level-1 { background: radial-gradient(circle at 20% 30%, #0a0f1a, #020617); }
    body.city-level-2 { background: radial-gradient(circle at 20% 30%, #14532d, #0a2f1a); }
    body.city-level-3 { background: radial-gradient(circle at 20% 30%, #1e3a2f, #0c4a2e); }
    body.city-level-4 { background: radial-gradient(circle at 20% 30%, #2d4a3a, #1e5a3a); }
    body.city-level-5 { background: radial-gradient(circle at 20% 30%, #facc15, #f97316); color: #0f172a; }
    body.city-level-5 .card { background: rgba(0,0,0,0.5); color: #e2e8f0; }

    footer {
      text-align: center;
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 2rem;
    }
    @media (max-width: 700px) {
      .shop-section { grid-template-columns: repeat(2,1fr); }
      .city-grid { grid-template-columns: repeat(4,1fr); }
    }
  </style>
</head>
<body>
<div class="fog-overlay" id="fogOverlay"></div>
<div class="container">
  <div class="card">
    <div class="header">
      <h1>🏙️ مدينة الإرادة | SimCity متقدم</h1>
      <div><span id="pointsDisplay">0</span> <span style="color:#facc15;">نقطة</span></div>
    </div>
    <div class="flex-btns">
      <button class="btn" id="successBtn">✅ نجحت اليوم (لا عادة سيئة) +10</button>
      <button class="btn btn-danger" id="failBtn">❌ سقطت اليوم -30</button>
      <button class="btn btn-warning" id="undoDayBtn">↩️ تراجع عن آخر يوم</button>
    </div>
    <div class="city-level-badge" id="cityLevelBadge">أرض فارغة</div>
  </div>

  <div class="card">
    <h3>🗺️ مدينتك (اضغط مطولاً لبيع المبنى واسترداد كامل المبلغ)</h3>
    <div id="cityGrid" class="city-grid"></div>
  </div>

  <div class="card">
    <h3>📊 لوحة الإحصائيات</h3>
    <div id="statsDashboard" class="stats-dashboard"></div>
  </div>

  <div class="card">
    <h3>🛒 متجر المدينة</h3>
    <div class="flex-btns" style="justify-content: flex-end;">
      <button id="undoPurchaseBtn" class="btn btn-warning" style="padding:6px 12px;">↩️ إلغاء آخر عملية شراء</button>
    </div>
    <div id="shopContainer" class="shop-section"></div>
  </div>

  <div class="card">
    <h3>🏆 الإنجازات</h3>
    <div id="achievementsList" class="achievements-list"></div>
  </div>

  <div class="card">
    <h3>📅 سجل آخر 30 يوم</h3>
    <div id="calendar" class="calendar-grid"></div>
  </div>

  <div class="card">
    <div style="display: flex; gap:10px; justify-content: flex-end; flex-wrap: wrap;">
      <button id="resetGameBtn" class="btn btn-danger">🗑️ إعادة ضبط اللعبة</button>
      <button id="exportBtn" class="btn">📤 تصدير</button>
      <button id="importBtn" class="btn">📥 استيراد</button>
    </div>
  </div>
  <footer>✨ كل نجاح يبني مدينتك | الضباب الأسود يتراجع مع انتصاراتك | الهدف: 365 يوماً بدون عادة سيئة</footer>
</div>

<script>
  // ======================== بيانات اللعبة المتقدمة ========================
  const STORAGE_KEY = "simcity_habit_ultimate";

  // المباني والديكورات والمعززات
  const BUILDINGS = [
    { id: "tent", name: "خيمة", cost: 20, emoji: "🏕️", type: "building", description: "أول مأوى" },
    { id: "house", name: "بيت صغير", cost: 100, emoji: "🏠", type: "building", description: "منزل متواضع" },
    { id: "shop", name: "متجر صغير", cost: 200, emoji: "🏪", type: "building", description: "تجارة محلية" },
    { id: "school", name: "مدرسة", cost: 350, emoji: "🏫", type: "building", description: "علم يبني عقولاً" },
    { id: "library", name: "مكتبة", cost: 400, emoji: "📚", type: "building", description: "قوة المعرفة" },
    { id: "spiritual", name: "مركز روحاني", cost: 450, emoji: "🕌", type: "building", description: "سلام داخلي" },
    { id: "power", name: "محطة طاقة", cost: 500, emoji: "⚡", type: "building", description: "طاقة نظيفة" },
    { id: "factory", name: "مصنع", cost: 700, emoji: "🏭", type: "building", description: "صناعة متطورة" },
    { id: "tower", name: "برج كبير", cost: 1200, emoji: "🗼", type: "building", description: "شموخ المدينة" },
    { id: "palace", name: "قصر الأسطورة", cost: 3000, emoji: "🏰", type: "building", description: "قمة الإنجاز" }
  ];

  const DECORATIONS = [
    { id: "tree", name: "شجرة", cost: 15, emoji: "🌳", type: "decoration", description: "طبيعة خضراء" },
    { id: "fountain", name: "نافورة", cost: 90, emoji: "⛲", type: "decoration", description: "جمال مائي" },
    { id: "garden", name: "حديقة", cost: 150, emoji: "🌻", type: "decoration", description: "مساحات خضراء" },
    { id: "statue", name: "تمثال", cost: 250, emoji: "🗿", type: "decoration", description: "رمز العزيمة" },
    { id: "streetlight", name: "أضواء شارع", cost: 300, emoji: "💡", type: "decoration", description: "أنوار المدينة" }
  ];

  const BOOSTERS = [
    { id: "double", name: "مضاعف نقاط اليوم ×2", cost: 250, type: "booster", effect: "double", once: true, description: "ضعف النقاط في اليوم القادم" },
    { id: "shield", name: "درع الحماية", cost: 700, type: "booster", effect: "shield", once: true, description: "يحمي streak من السقوط مرة واحدة" },
    { id: "forgiveness", name: "يوم سماح", cost: 500, type: "booster", effect: "forgive", once: true, description: "يسجل يوماً ناجحاً بدون لعب" },
    { id: "weeklyBonus", name: "زيادة مكافأة الأسبوع +20", cost: 800, type: "booster", effect: "weeklyBonus", once: true, description: "كل أسبوع يزيد المكافأة 20 نقطة" }
  ];

  const ALL_ITEMS = [...BUILDINGS, ...DECORATIONS, ...BOOSTERS];

  let state = {
    points: 0,
    streak: 0,
    maxStreak: 0,
    history: {},        // { "2025-03-27": "success"/"fail" }
    cityGrid: Array(36).fill(null),
    boostersActive: { double: false, shield: false, weeklyBonusAdded: false },
    totalSuccesses: 0,
    totalFails: 0,
    totalPointsEarned: 0,
    totalPointsSpent: 0,
    achievementsUnlocked: [],
    purchaseHistory: []  // سجل آخر 10 عمليات شراء (لإلغاء آخر شراء)
  };

  // تعريف الإنجازات
  const ACHIEVEMENTS = [
    { id: "first", name: "أول يوم نجاح", condition: (s) => s.totalSuccesses >= 1, reward: 50 },
    { id: "3days", name: "3 أيام متتالية", condition: (s) => s.maxStreak >= 3, reward: 80 },
    { id: "7days", name: "7 أيام", condition: (s) => s.maxStreak >= 7, reward: 150 },
    { id: "14days", name: "14 يوم", condition: (s) => s.maxStreak >= 14, reward: 250 },
    { id: "30days", name: "30 يوم", condition: (s) => s.maxStreak >= 30, reward: 500 },
    { id: "60days", name: "60 يوم", condition: (s) => s.maxStreak >= 60, reward: 800 },
    { id: "90days", name: "90 يوم", condition: (s) => s.maxStreak >= 90, reward: 1500 },
    { id: "100days", name: "100 يوم", condition: (s) => s.maxStreak >= 100, reward: 2000 }
  ];

  function getTodayStr() { return new Date().toISOString().slice(0,10); }

  // شراء عنصر مع تسجيل في سجل المشتريات
  function purchaseItem(itemId) {
    const item = ALL_ITEMS.find(i => i.id === itemId);
    if (!item) return false;
    if (state.points < item.cost) { alert("نقاط غير كافية!"); return false; }
    if (item.type === "building" || item.type === "decoration") {
      const newItem = { id: item.id, name: item.name, emoji: item.emoji, type: item.type, cost: item.cost };
      const emptyIndex = state.cityGrid.findIndex(cell => cell === null);
      if (emptyIndex === -1) { alert("مدينتك ممتلئة! لا يمكنك إضافة المزيد."); return false; }
      state.cityGrid[emptyIndex] = newItem;
      state.points -= item.cost;
      state.totalPointsSpent += item.cost;
      // تسجيل العملية
      state.purchaseHistory.unshift({ type: "building", itemId: item.id, cost: item.cost, index: emptyIndex });
      if (state.purchaseHistory.length > 20) state.purchaseHistory.pop();
      saveGame();
      renderCity();
      updateAllUI();
      return true;
    } else if (item.type === "booster") {
      if (item.id === "double") {
        if (state.boostersActive.double) { alert("لديك مضاعف نشط بالفعل!"); return false; }
        state.boostersActive.double = true;
      } else if (item.id === "shield") {
        if (state.boostersActive.shield) { alert("لديك درع بالفعل!"); return false; }
        state.boostersActive.shield = true;
      } else if (item.id === "forgiveness") {
        const today = getTodayStr();
        if (state.history[today]) { alert("اليوم مسجل بالفعل!"); return false; }
        state.history[today] = "success";
        state.totalSuccesses++;
        state.streak++;
        if (state.streak > state.maxStreak) state.maxStreak = state.streak;
        let earned = 10;
        if (state.boostersActive.double) { earned *= 2; state.boostersActive.double = false; }
        state.points += earned;
        state.totalPointsEarned += earned;
        state.points -= item.cost;
        state.totalPointsSpent += item.cost;
        alert(`تم تفعيل يوم سماح! حصلت على ${earned} نقطة.`);
        saveGame();
        updateAllUI();
        return true;
      } else if (item.id === "weeklyBonus") {
        if (state.boostersActive.weeklyBonusAdded) { alert("تم شراء هذه الميزة مسبقاً"); return false; }
        state.boostersActive.weeklyBonusAdded = true;
      }
      state.points -= item.cost;
      state.totalPointsSpent += item.cost;
      state.purchaseHistory.unshift({ type: "booster", itemId: item.id, cost: item.cost });
      if (state.purchaseHistory.length > 20) state.purchaseHistory.pop();
      saveGame();
      updateAllUI();
      return true;
    }
    return false;
  }

  // إلغاء آخر عملية شراء
  function undoLastPurchase() {
    if (state.purchaseHistory.length === 0) { alert("لا توجد عمليات شراء للإلغاء."); return; }
    const last = state.purchaseHistory[0];
    if (last.type === "building") {
      // إزالة المبنى من الخلية
      if (state.cityGrid[last.index] && state.cityGrid[last.index].id === last.itemId) {
        state.cityGrid[last.index] = null;
        state.points += last.cost;
        state.totalPointsSpent -= last.cost;
        state.purchaseHistory.shift();
        saveGame();
        renderCity();
        updateAllUI();
        alert(`تم إلغاء شراء ${ALL_ITEMS.find(i=>i.id===last.itemId).name} واسترداد ${last.cost} نقطة.`);
      } else {
        alert("لا يمكن التراجع، ربما تم بيع المبنى يدوياً.");
      }
    } else if (last.type === "booster") {
      // المعززات: نعيد النقاط ونلغي التأثير
      const booster = ALL_ITEMS.find(i => i.id === last.itemId);
      if (!booster) return;
      state.points += last.cost;
      state.totalPointsSpent -= last.cost;
      if (last.itemId === "double") state.boostersActive.double = false;
      else if (last.itemId === "shield") state.boostersActive.shield = false;
      else if (last.itemId === "weeklyBonus") state.boostersActive.weeklyBonusAdded = false;
      state.purchaseHistory.shift();
      saveGame();
      updateAllUI();
      alert(`تم إلغاء شراء ${booster.name} واسترداد ${last.cost} نقطة.`);
    }
  }

  // بيع مبنى (كامل الثمن)
  function sellBuilding(index) {
    const building = state.cityGrid[index];
    if (!building) return false;
    if (confirm(`هل تريد بيع ${building.name} واسترداد ${building.cost} نقطة؟`)) {
      state.points += building.cost;
      state.totalPointsEarned += building.cost;
      state.cityGrid[index] = null;
      saveGame();
      renderCity();
      updateAllUI();
      return true;
    }
    return false;
  }

  // نجاح اليوم
  function handleSuccess() {
    const today = getTodayStr();
    if (state.history[today]) { alert("لقد سجلت اليوم بالفعل!"); return; }
    let pointsEarned = 10;
    if (state.boostersActive.double) { pointsEarned *= 2; state.boostersActive.double = false; }
    state.points += pointsEarned;
    state.totalPointsEarned += pointsEarned;
    state.totalSuccesses++;
    state.streak++;
    if (state.streak > state.maxStreak) state.maxStreak = state.streak;

    let bonus = 0;
    if (state.streak === 7) bonus = 50;
    else if (state.streak === 14) bonus = 120;
    else if (state.streak === 30) bonus = 300;
    else if (state.streak === 60) bonus = 700;
    else if (state.streak === 90) bonus = 1500;
    if (bonus > 0) {
      state.points += bonus;
      state.totalPointsEarned += bonus;
      alert(`🎉 مكافأة سلسلة ${state.streak} يوم: +${bonus} نقطة!`);
    }
    if (state.boostersActive.weeklyBonusAdded && state.streak % 7 === 0 && state.streak !== 0) {
      state.points += 20;
      state.totalPointsEarned += 20;
      alert(`✨ مكافأة أسبوعية إضافية +20 نقطة!`);
    }

    state.history[today] = "success";
    saveGame();
    checkAchievements();
    updateAllUI();
  }

  // فشل اليوم
  function handleFail() {
    const today = getTodayStr();
    if (state.history[today]) { alert("اليوم مسجل بالفعل!"); return; }
    let penalty = 30;
    state.points = Math.max(0, state.points - penalty);
    state.totalPointsEarned = Math.max(0, state.totalPointsEarned - penalty);
    state.totalFails++;
    if (state.boostersActive.shield) {
      state.boostersActive.shield = false;
      alert("🛡️ تم تفعيل الدرع! لم تخسر الـ streak.");
    } else {
      state.streak = 0;
    }
    state.history[today] = "fail";
    saveGame();
    checkAchievements();
    updateAllUI();
  }

  // تراجع عن آخر يوم (سواء نجاح أو فشل)
  function undoLastDay() {
    const today = getTodayStr();
    if (!state.history[today]) { alert("لا يوجد يوم مسجل اليوم للتراجع."); return; }
    const lastStatus = state.history[today];
    // إعادة الحسابات
    if (lastStatus === "success") {
      // نخصم النقاط التي أضيفت
      let earned = 10;
      // نعرف إن كان هناك مضاعف؟ صعب التتبع بدقة، لكننا سنستخدم القيمة الافتراضية (10)
      // وللتيسير: نخصم 10 فقط، ونعيد الـ streak.
      state.points -= 10;
      state.totalPointsEarned -= 10;
      state.totalSuccesses--;
      state.streak--;
      if (state.streak < 0) state.streak = 0;
      // مكافآت السلسلة: لا يمكن التراجع عنها بسهولة، لكن سنقوم بإعادة حساب الـ maxStreak
      // ببساطة نعيد حساب maxStreak من البداية
      recalcMaxStreak();
    } else if (lastStatus === "fail") {
      state.points += 30;
      state.totalPointsEarned += 30;
      state.totalFails--;
      // استعادة الـ streak السابق: نحتاج إلى إعادة حساب streak من التاريخ
      recalcStreak();
    }
    delete state.history[today];
    saveGame();
    checkAchievements();
    updateAllUI();
    alert("تم التراجع عن آخر يوم.");
  }

  // إعادة حساب الـ streak بناءً على التاريخ
  function recalcStreak() {
    let streak = 0;
    let today = new Date();
    for (let i=0; i<1000; i++) {
      let d = new Date(today);
      d.setDate(today.getDate() - i);
      let dateStr = d.toISOString().slice(0,10);
      const day = state.history[dateStr];
      if (day === "success") streak++;
      else break;
    }
    state.streak = streak;
  }

  function recalcMaxStreak() {
    // نحسب أطول سلسلة متتالية في كل التواريخ
    let maxStreak = 0;
    let dates = Object.keys(state.history).sort();
    let current = 0;
    for (let i=0; i<dates.length; i++) {
      if (state.history[dates[i]] === "success") {
        current++;
        if (current > maxStreak) maxStreak = current;
      } else {
        current = 0;
      }
    }
    state.maxStreak = maxStreak;
  }

  // إجمالي قيمة المباني
  function getTotalBuildingValue() {
    let total = 0;
    for (let cell of state.cityGrid) {
      if (cell && (cell.type === "building" || cell.type === "decoration")) {
        total += cell.cost;
      }
    }
    return total;
  }

  // تحديث مرحلة المدينة
  function updateCityLevel() {
    const value = getTotalBuildingValue();
    let level = 1;
    if (value >= 5000) level = 5;
    else if (value >= 2500) level = 4;
    else if (value >= 1000) level = 3;
    else if (value >= 300) level = 2;
    else level = 1;
    const levelNames = ["أرض فارغة", "قرية صغيرة", "مدينة ناشئة", "مدينة متطورة", "مدينة الأسطورة"];
    document.getElementById("cityLevelBadge").innerHTML = levelNames[level-1];
    document.body.className = `city-level-${level}`;
    return level;
  }

  // تأثير الضباب
  function applyFog() {
    const fog = document.getElementById("fogOverlay");
    let opacity = Math.max(0, 0.4 - (state.streak / 100));
    if (state.streak < 3) opacity = 0.6;
    if (state.streak === 0) opacity = 0.75;
    fog.style.opacity = opacity;
  }

  // عرض المدينة
  function renderCity() {
    const gridDiv = document.getElementById("cityGrid");
    gridDiv.innerHTML = "";
    for (let i = 0; i < state.cityGrid.length; i++) {
      const cell = state.cityGrid[i];
      const tile = document.createElement("div");
      tile.className = "city-tile";
      if (cell) {
        tile.innerHTML = `${cell.emoji}<span class="building-tooltip">${cell.name} (${cell.cost} نقطة)</span>`;
        tile.oncontextmenu = (e) => {
          e.preventDefault();
          sellBuilding(i);
          return false;
        };
      } else {
        tile.innerHTML = "⬜";
        tile.oncontextmenu = null;
      }
      gridDiv.appendChild(tile);
    }
  }

  // عرض الإحصائيات
  function renderStats() {
    const successRate = (state.totalSuccesses + state.totalFails) === 0 ? 0 : Math.round((state.totalSuccesses / (state.totalSuccesses + state.totalFails)) * 100);
    const statsHtml = `
      <div class="stat-card"><div class="stat-value">${state.totalSuccesses}</div><div>✅ نجاحات</div></div>
      <div class="stat-card"><div class="stat-value">${state.totalFails}</div><div>❌ سقطات</div></div>
      <div class="stat-card"><div class="stat-value">${state.streak}</div><div>🔥 الـ streak الحالي</div></div>
      <div class="stat-card"><div class="stat-value">${state.maxStreak}</div><div>🏆 أطول streak</div></div>
      <div class="stat-card"><div class="stat-value">${state.totalPointsEarned}</div><div>💰 إجمالي نقاط مكتسبة</div></div>
      <div class="stat-card"><div class="stat-value">${state.totalPointsSpent}</div><div>🛒 نقاط مصروفة</div></div>
      <div class="stat-card"><div class="stat-value">${successRate}%</div><div>📊 نسبة النجاح</div></div>
    `;
    document.getElementById("statsDashboard").innerHTML = statsHtml;
  }

  // عرض التقويم (آخر 30 يوم)
  function renderCalendar() {
    const calendarDiv = document.getElementById("calendar");
    calendarDiv.innerHTML = "";
    const today = new Date();
    const days = [];
    for (let i = 29; i >= 0; i--) {
      let d = new Date(today);
      d.setDate(today.getDate() - i);
      days.push(d.toISOString().slice(0,10));
    }
    days.forEach(dateStr => {
      const status = state.history[dateStr];
      let statusClass = "missed";
      let symbol = "◻️";
      if (status === "success") { statusClass = "success"; symbol = "✅"; }
      else if (status === "fail") { statusClass = "fail"; symbol = "❌"; }
      const dayDiv = document.createElement("div");
      dayDiv.className = `cal-day ${statusClass}`;
      dayDiv.innerHTML = `${new Date(dateStr).getDate()}<br>${symbol}`;
      calendarDiv.appendChild(dayDiv);
    });
  }

  // عرض المتجر
  function renderShop() {
    const shopDiv = document.getElementById("shopContainer");
    shopDiv.innerHTML = "";
    ALL_ITEMS.forEach(item => {
      const btn = document.createElement("div");
      btn.className = "shop-item";
      btn.innerHTML = `
        <div style="font-size:2rem;">${item.emoji}</div>
        <div><strong>${item.name}</strong></div>
        <div class="shop-price">${item.cost} نقطة</div>
        <div style="font-size:0.6rem;">${item.description}</div>
      `;
      btn.onclick = () => purchaseItem(item.id);
      shopDiv.appendChild(btn);
    });
  }

  // التحقق من الإنجازات
  function checkAchievements() {
    let newUnlocked = false;
    for (let ach of ACHIEVEMENTS) {
      if (!state.achievementsUnlocked.includes(ach.id) && ach.condition(state)) {
        state.achievementsUnlocked.push(ach.id);
        state.points += ach.reward;
        state.totalPointsEarned += ach.reward;
        newUnlocked = true;
        alert(`🏆 إنجاز جديد: ${ach.name}! حصلت على ${ach.reward} نقطة إضافية.`);
      }
    }
    if (newUnlocked) saveGame();
    renderAchievements();
  }

  function renderAchievements() {
    const container = document.getElementById("achievementsList");
    container.innerHTML = "";
    ACHIEVEMENTS.forEach(ach => {
      const unlocked = state.achievementsUnlocked.includes(ach.id);
      const badge = document.createElement("div");
      badge.className = `achievement-badge ${!unlocked ? 'locked' : ''}`;
      badge.innerHTML = `${ach.name} ${unlocked ? '✅' : '🔒'} ${unlocked ? `+${ach.reward}` : ''}`;
      container.appendChild(badge);
    });
  }

  // تحديث كل الواجهة
  function updateAllUI() {
    document.getElementById("pointsDisplay").innerHTML = state.points;
    renderCity();
    renderStats();
    renderCalendar();
    renderShop();
    renderAchievements();
    updateCityLevel();
    applyFog();
  }

  // حفظ اللعبة
  function saveGame() {
    const toSave = {
      points: state.points,
      streak: state.streak,
      maxStreak: state.maxStreak,
      history: state.history,
      cityGrid: state.cityGrid,
      boostersActive: state.boostersActive,
      totalSuccesses: state.totalSuccesses,
      totalFails: state.totalFails,
      totalPointsEarned: state.totalPointsEarned,
      totalPointsSpent: state.totalPointsSpent,
      achievementsUnlocked: state.achievementsUnlocked,
      purchaseHistory: state.purchaseHistory
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  }

  // تحميل اللعبة
  function loadGame() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        const data = JSON.parse(saved);
        state = { ...state, ...data };
        if (!state.cityGrid || state.cityGrid.length !== 36) state.cityGrid = Array(36).fill(null);
        if (!state.boostersActive) state.boostersActive = { double: false, shield: false, weeklyBonusAdded: false };
        if (!state.totalPointsEarned) state.totalPointsEarned = state.points;
        if (!state.totalPointsSpent) state.totalPointsSpent = 0;
        if (!state.achievementsUnlocked) state.achievementsUnlocked = [];
        if (!state.purchaseHistory) state.purchaseHistory = [];
      } catch(e) {}
    }
    updateAllUI();
  }

  // إعادة ضبط كامل
  function resetGame() {
    if (confirm("سيتم حذف كل تقدمك بالكامل. هل أنت متأكد؟")) {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  }

  // تصدير
  function exportGame() {
    const data = localStorage.getItem(STORAGE_KEY);
    const blob = new Blob([data || "{}"], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `simcity_save_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // استيراد
  function importGame(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const imported = JSON.parse(e.target.result);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(imported));
        location.reload();
      } catch(err) { alert("ملف غير صالح"); }
    };
    reader.readAsText(file);
  }

  // ربط الأحداث
  document.getElementById("successBtn").addEventListener("click", handleSuccess);
  document.getElementById("failBtn").addEventListener("click", handleFail);
  document.getElementById("undoDayBtn").addEventListener("click", undoLastDay);
  document.getElementById("undoPurchaseBtn").addEventListener("click", undoLastPurchase);
  document.getElementById("resetGameBtn").addEventListener("click", resetGame);
  document.getElementById("exportBtn").addEventListener("click", exportGame);
  const importInput = document.createElement("input");
  importInput.type = "file";
  importInput.accept = "application/json";
  document.getElementById("importBtn").addEventListener("click", () => importInput.click());
  importInput.addEventListener("change", (e) => {
    if (e.target.files[0]) importGame(e.target.files[0]);
  });

  // بدء اللعبة
  loadGame();
</script>
</body>
</html>
